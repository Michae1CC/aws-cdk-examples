user nginx;
# As a rule of thumb: worker_rlimit_nofile >= worker_connections * 2
# 65535 represents the maximum number of available network ports in the TCP/IP stack
worker_rlimit_nofile 65535;
worker_processes auto;
pid /run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
	use epoll;
	worker_connections 4096;
	multi_accept on;
}

http {

	##
	# Basic Settings
	##

	# Default directory where all website files are located
	# TODO: Update this location
	root /etc/nginx;

	# Enable zero-copy file transfers.
	sendfile on;
	# Used in conjunction with sendfile so that HTTP response headers
	# are sent in one packet right after the chunk of data has been
	# obtained by sendfile.
	tcp_nopush on;
	# The tcp_nodelay directive allows override of Nagle's algorithm,
	# originally designed to solve problems with small packets in slow
	# networks. Nowadays, when serving large static files, the data can
	# be immediately sent regardless of the packet size.
	tcp_nodelay on;

	# Sets the maximum size of the internal hash tables used to store
	# and quickly look up MIME types.
	types_hash_max_size 2048;
	# Sets the memory bucket size for Nginx's MIME types hash table.
	types_hash_bucket_size 128;

	# The maximum number of requests that can be served through one
	# keep-alive connection. After the maximum number of requests are
	# made, the connection is lost.
	keepalive_requests 1000;
	# Sets a timeout during which a keep-alive client connection will
	# stay open on the server side. The second value sets the value in
	# the Keep-Alive header.
	keepalive_timeout 75s 75s;

	include /etc/nginx/mime.types;
	
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	# Create a json log format. This will make it easier to search
	# for logs when they are injested into Cloudwatch
	# NOTE: The log format should not contains newlines since this will cause
	# cloudwatch to breakup a single nginx access log into multiple cloduwatch log entries
    log_format json_log escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"http_referer":"$http_referer",'
        '"request_time":"$request_time",'
        '"request_length":"$request_length",'
        '"connection":"$connection",'
        '"connection_requests":"$connection_requests",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"headers":{'
		'"accept":"$http_accept",'
		'"accept-encoding":"$http_accept_encoding",'
		'"accept-language":"$http_accept_language",'
		'"access-control-request-headers":"$http_access_control_request_headers",'
		'"access-control-request-method":"$http_access_control_request_method",'
		'"alt-used":"$http_alt_used",'
		'"available-dictionary":"$http_available_dictionary",'
		'"cache-control":"$http_cache_control",'
		'"connection":"$http_connection",'
		'"content-digest":"$http_content_digest",'
		'"content-disposition":"$http_content_disposition",'
		'"content-encoding":"$http_content_encoding",'
		'"content-language":"$http_content_language",'
		'"content-length":"$http_content_length",'
		'"content-location":"$http_content_location",'
		'"content-type":"$http_content_type",'
		'"date":"$http_date",'
		'"dictionary-id":"$http_dictionary_id",'
		'"downlink":"$http_downlink",'
		'"early-data":"$http_early_data",'
		'"expect":"$http_expect",'
		'"host":"$http_host",'
		'"priority":"$http_priority",'
		'"if-modified-since":"$http_if_modified_since",'
		'"if-none-match":"$http_if_none_match",'
		'"if-range":"$http_if_range",'
		'"if-unmodified-since":"$http_if_unmodified_since",'
		'"keep-alive":"$http_keep_alive",'
		'"link":"$http_link",'
		'"origin":"$http_origin",'
		'"range":"$http_range",'
		'"referer":"$http_referer",'
		'"sec-fetch-dest":"$http_sec_fetch_dest",'
		'"sec-fetch-mode":"$http_sec_fetch_mode",'
		'"sec-fetch-site":"$http_sec_fetch_site",'
		'"sec-fetch-user":"$http_sec_fetch_user",'
		'"sec-fetch-storage-access":"$http_sec_fetch_storage_access",'
		'"sec-fetch-storage-access":"$http_sec_fetch_storage_access",'
		'"te":"$http_te",'
		'"transfer-encoding":"$http_transfer_encoding",'
		'"upgrade-insecure-requests":"$http_upgrade_insecure_requests",'
		'"via":"$http_via",'
		'"user-agent":"$http_user_agent",'
		'"x-forwarded-for":"$http_x_forwarded_for",'
		'"x-forwarded-host":"$http_x_forwarded_host",'
		'"x-forwarded-proto":"$http_x_forwarded_proto",'
		'"x-forwarded-port":"$http_x_forwarded_port"'
		'}'
		'}';

	access_log /var/log/nginx/access.log json_log;
	error_log /var/log/nginx/error.log notice;

	##
	# Gzip Settings
	##

	gzip on;

	server {
		listen 80;
		listen [::]:80;
		# Allow the proxy to serve all domains for now.
		# This should become the CLoudfront distribution?
		server_name _;

		location = /healthcheck {
			access_log off;
			return 200;
		}

		location = /nginx_status {
			access_log off;
			stub_status on;
			# Allow local machine (Loopback)
			allow 127.0.0.1;
			allow ::1;
			# Deny all other IPs
			deny all;
		}

		location / {
			# Tries to server the request as a file, then a directory,
			# and falls back to 404 error if neither exist.
			try_files $uri $uri/ $uri.html =404;
			# Configure NGINX to return an automatically generated directory
			# listing instead serving an index file.
			autoindex on;
		}
	}
}

